<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><title>FlowField</title></head>
<body>
<div class="az-demo" style="max-width: 400px;">
<svg class="az-flow" viewBox="0 0 520 560" aria-hidden="true">
<path id="base" class="az-flow__base" d=""></path>
<path id="accent" class="az-flow__accent" d=""></path>
</svg>
</div>
<script>
function flow(seed, count, steps, len) {
  var s = seed;
  function r() { s = (s * 16807) % 2147483647; return s / 2147483647; }
  var d = '';
  for (var i = 0; i < count; i++) {
    var x = r() * 560 - 20, y = r() * 600 - 20;
    d += 'M' + x.toFixed(1) + ' ' + y.toFixed(1);
    for (var k = 0; k < steps; k++) {
      var a = Math.sin(x * 0.011) * 1.4 + Math.cos(y * 0.013) * 1.3 + Math.sin((x - y) * 0.006) * 0.8;
      x += Math.cos(a) * len; y += Math.sin(a) * len;
      d += 'L' + x.toFixed(1) + ' ' + y.toFixed(1);
    }
  }
  return d;
}
document.getElementById('base').setAttribute('d', flow(12345, 220, 14, 6));
document.getElementById('accent').setAttribute('d', flow(987, 14, 30, 6));
</script>
</body>
</html>
